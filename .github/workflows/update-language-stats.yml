name: Actualizar gráfico de commits por colaborador

on:
  push:
    branches:
      - main
  schedule:
    - cron: "30 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contributor-stats-main
  cancel-in-progress: false

jobs:
  generate-chart:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Obtener contribuciones desde GitHub
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const contributors = await github.paginate(
              github.rest.repos.listContributors,
              { ...context.repo, per_page: 100 }
            );
            fs.writeFileSync(
              'contributors.json',
              JSON.stringify(contributors.map(({ login, contributions, type }) => ({ login, contributions, type })))
            );

      - name: Generar GIF animado
        run: |
          python -m pip install --quiet Pillow
          python .github/scripts/generate-contributor-chart.py contributors.json stats/contributors.gif

      - name: Guardar el gráfico si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats/contributors.gif
          if git diff --cached --quiet; then
            echo "El gráfico ya está actualizado."
            exit 0
          fi
          git commit -s -m "docs: actualizar gráfico de commits por colaborador"
          git push origin HEAD:main
