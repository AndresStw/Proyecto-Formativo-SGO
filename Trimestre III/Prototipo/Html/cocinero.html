<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cocinero - Sabor Caleño</title>
 
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://kit.fontawesome.com/a0994db117.js" crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/cocinero.css">
</head>
 
<body>
 
<div class="dashboard-layout">
 
    <aside class="sidebar">
        <div class="sidebar-logo">
            <img src="../Img/WhatsApp_Image_2026-06-25_at_2.32.04_PM-removebg-preview.png" alt="Logo">
            <h2>Sabor Caleño</h2>
            <p>Portal cocinero</p>
        </div>
 
        <nav class="sidebar-menu">
            <a href="#"><i class="fa-solid fa-house"></i> Inicio</a>
            <a href="#" class="active"><i class="fa-solid fa-kitchen-set"></i> Pedidos</a>
            <a href="#"><i class="fa-solid fa-utensils"></i> Menú</a>
            <a href="index.html"><i class="fa-solid fa-right-from-bracket"></i> Salir</a>
        </nav>
    </aside>
 
    <main class="dashboard-main">
 
        <header class="topbar">
            <div>
                <h1>Panel Cocinero</h1>
                <p>Gestiona los pedidos que llegan a cocina.</p>
            </div>
 
            <div class="admin-info">
                <i class="fa-solid fa-circle-user"></i>
                <span>Cocinero</span>
            </div>
        </header>
 
        <section class="row g-4 mb-4">
 
            <div class="col-lg-4 col-md-6">
                <div class="card-resumen">
                    <i class="fa-solid fa-clock"></i>
                    <div>
                        <h3 id="contadorPendientes">0</h3>
                        <p>Pedidos pendientes</p>
                    </div>
                </div>
            </div>
 
            <div class="col-lg-4 col-md-6">
                <div class="card-resumen">
                    <i class="fa-solid fa-check"></i>
                    <div>
                        <h3 id="contadorListos">0</h3>
                        <p>Pedidos listos </p>
                    </div>
                </div>
            </div>
 
            <div class="col-lg-4 col-md-12">
                <div class="card-resumen">
                    <i class="fa-solid fa-bowl-food"></i>
                    <div>
                        <h3 id="contadorTotal">0</h3>
                        <p>Total de pedidos</p>
                    </div>
                </div>
            </div>
 
        </section>
 
        <section class="panel-pedidos">
            <div class="cabecera-tabla">
                <div>
                    <h2>Pedidos en cocina</h2>
                    <p>Marca cada pedido como listo cuando termines de prepararlo</p>
                </div>
            </div>
 
            <div class="pedidos-grid" id="contenedorPedidos">
            </div>
        </section>
 
    </main>
 
</div>
 
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../JavaScript/cocinero.js"></script>
 
</body>
</html>
