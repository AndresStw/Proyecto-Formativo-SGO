<main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">

    <div class="card border-0 shadow-sm p-4">

            </thead>
            <tbody>
                <tr>
                    <td><img src="../Assets/Img/platos/Sancocho.jpg" style="width: 50px; height: 50px; object-fit: cover; border-radius: 6px;"></td>

                    <td>Platos Fuertes</td>
                    <td>$25.000</td>
                    <td>
                        <button class="btn btn-sm btn-light border"><i class="fa-solid fa-pen"></i></button>

                    </td>
                </tr>
            </tbody>
        </table>
