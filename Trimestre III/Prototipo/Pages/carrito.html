<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../Assets/CSS/global.css">
    <link rel="stylesheet" href="../Assets/CSS/menu.css">
    <link rel="icon" href="../Assets/Img/logos/logo_sabor caleño2026.png">
    <title>Sabor Caleño - Mi Carrito</title>
</head>
<body>

    <header>
        <nav class="d-flex justify-content-around align-items-center gap-4 p-3" style="background: linear-gradient(90deg, #ff6b00, #ff8c00, #ffb347); box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.3);">
            <img src="../Assets/Img/logos/logo_sabor caleño2026.png" alt="Logo" style="width: 60px; border-radius: 10px; border: 2px solid black;">
            <p class="m-0 text-white fw-bold fs-3" style="font-style: italic;">Sabor Caleño</p>
            <div class="d-flex justify-content-end gap-4 align-items-center">
                <a class="text-white text-decoration-none fw-bold" href="../index.html">Inicio</a>
                <a class="text-white text-decoration-none fw-bold" href="../Pages/contacto.html">Nosotros</a>
                <a class="text-white text-decoration-none fw-bold" href="../Pages/menu.html">Menú</a>
            </div>
        </nav>
    </header>

    <main class="container py-5">
        <h2 class="fw-bold mb-4" style="color: #ff6b00;"><i class="fa-solid fa-basket-shopping me-2"></i>Tu Pedido</h2>

        <div class="row g-4">
            <div class="col-lg-8">
                <div class="card shadow-sm border-0 p-3">
                    <div class="table-responsive">
                        <table class="table align-middle">
                            <thead>
                                <tr>
                                    <th>Plato</th>
                                    <th>Precio</th>
                                    <th>Cantidad</th>
                                    <th>Subtotal</th>
                                    <th>Acción</th>
                                </tr>
                            </thead>
                            <tbody id="items-carrito">
                                <tr>
                                    <td><b>Sancocho Valluno</b></td>
                                    <td>$25.000</td>
                                    <td>1</td>
                                    <td>$25.000</td>
                                    <td><button class="btn btn-sm btn-danger"><i class="fa-solid fa-trash"></i></button></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="card shadow-sm border-0 p-4">
                    <h5 class="fw-bold mb-3">Resumen de Compra</h5>
                    <hr>
                    <div class="d-flex justify-content-between mb-2">
                        <span>Subtotal</span>
                        <span id="subtotal-pedido">$25.000</span>
                    </div>
                    <div class="d-flex justify-content-between mb-3">
                        <span>Envío</span>
                        <span class="text-success">Gratis</span>
                    </div>
                    <hr>
                    <div class="d-flex justify-content-between mb-4 fw-bold fs-5">
                        <span>Total</span>
                        <span style="color: #ff6b00;" id="total-pedido">$25.000</span>
                    </div>
                    <button class="btn btn-dark w-100 fw-bold py-2 mb-2" id="btn-proceder">Proceder al Pago</button>
                    <a href="../Pages/menu.html" class="btn btn-outline-secondary w-100 btn-sm">Seguir Comprando</a>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bundle.min.js"></script>
    <script src="../Assets/JavaScript/carrito.js"></script>
</body>
</html>
