<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../Assets/CSS/index.css">
    <link rel="stylesheet" href="../Assets/CSS/login.css">
    <link rel="icon" href="../Assets/Img/logos/logo_sabor caleño2026.png">
    <title>Sabor Caleño - Iniciar Sesión</title>
</head>
<body class="bg-light d-flex align-items-center vh-100">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow border-0 p-4">
                    <div class="text-center mb-4">
                        <img src="../Assets/Img/logos/logo_sabor caleño2026.png" alt="Logo" class="mb-2" style="width: 80px; border-radius: 50%;">
                        <h3 class="fw-bold" style="color: #ff6b00;">Iniciar Sesión</h3>
                        <p class="text-muted">¡Qué bueno tenerte de vuelta!</p>
                    </div>

                    <form id="form-login">
                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold">Correo Electrónico</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="fa-solid fa-envelope text-muted"></i></span>
                                <input type="email" class="form-control" id="email" placeholder="correo@ejemplo.com" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label fw-semibold">Contraseña</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="fa-solid fa-lock text-muted"></i></span>
                                <input type="password" class="form-control" id="password" placeholder="********" required>
                            </div>
                        </div>

                        <button type="submit" class="btn w-100 text-white my-2 fw-bold" style="background: linear-gradient(90deg, #ff6b00, #ff8c00, #ffb347); border: none;">
                            Ingresar
                        </button>
                    </form>

                    <div class="text-center mt-3">
                        <p class="mb-0 text-muted">¿No tienes cuenta? <a href="registro.html" class="text-decoration-none fw-bold" style="color: #ff8c00;">Regístrate aquí</a></p>
                        <a href="../index.html" class="d-block mt-3 text-muted text-decoration-none text-sm"><i class="fa-solid fa-arrow-left me-1"></i> Volver al Inicio</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bundle.min.js"></script>
    <script src="Assets/JavaScript/auth.js"></script>
    <script src="../Assets/JavaScript/login.js"></script>
</body>
</html>
