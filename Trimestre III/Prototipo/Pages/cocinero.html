<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cocinero - Sabor Caleño</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Carter+One&family=Monsieur+La+Doulaise&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../Assets/CSS/index.css">
    <link rel="stylesheet" href="../Assets/CSS/cocinero.css">
    <link rel="icon" href="../Assets/Img/logos/logo_sabor caleño2026.png">
</head>
<body>

    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="sidebar-logo">
                <img src="../Assets/Img/logos/logo_sabor caleño2026.png" alt="Logo">
                <h2>Sabor Caleño</h2>
                <p>Portal cocinero</p>
            </div>
            <nav class="sidebar-menu">
                <a href="../index.html"><i class="fa-solid fa-house"></i> Inicio</a>
                <a href="../Admin/pedidos.html" class="active"><i class="fa-solid fa-kitchen-set"></i> Pedidos</a>
                <a href="../Pages/menu.html"><i class="fa-solid fa-utensils"></i> Menú</a>
                <a href="../index.html"><i class="fa-solid fa-right-from-bracket"></i> Salir</a>
            </nav>
        </aside>

        <main class="dashboard-main">
            <header class="topbar">
                <div>
                    <h1>Panel Cocinero</h1>
                    <p>Gestiona los pedidos que llegan a cocina.</p>
                </div>
                <div class="admin-info">
                    <i class="fa-solid fa-circle-user"></i>
                    <span>Cocinero</span>
                </div>
            </header>

            <section class="row g-4 mb-4">
                <div class="col-lg-4 col-md-6">
                    <div class="card-resumen">
                        <i class="fa-solid fa-clock"></i>
                        <div>
                            <h3 id="contadorPendientes">0</h3>
                            <p>Pedidos pendientes</p>
                        </div>
                    </div>
                </div>
                <div class="col-lg-4 col-md-6">
                    <div class="card-resumen">
                        <i class="fa-solid fa-check"></i>
                        <div>
                            <h3 id="contadorListos">0</h3>
                            <p>Pedidos listos</p>
                        </div>
                    </div>
                </div>
                <div class="col-lg-4 col-md-12">
                    <div class="card-resumen">
                        <i class="fa-solid fa-bowl-food"></i>
                        <div>
                            <h3 id="contadorTotal">0</h3>
                            <p>Total de pedidos</p>
                        </div>
                    </div>
                </div>
            </section>

            <section class="panel-pedidos">
                <div class="cabecera-tabla">
                    <div>
                        <h2>Pedidos en cocina</h2>
                        <p>Marca cada pedido como listo cuando termines de prepararlo</p>
                    </div>
                </div>
                <div class="pedidos-grid" id="contenedorPedidos"></div>
            </section>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bundle.min.js"></script>
    <script src="../Assets/JavaScript/cocinero.js"></script>
    <script src="Assets/JavaScript/auth.js"></script>
    
</body>
</html>
