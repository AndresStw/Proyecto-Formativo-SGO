<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../Assets/CSS/global.css">
    <link rel="stylesheet" href="../Assets/CSS/reservas.css">
    <link rel="icon" href="../Assets/Img/logos/logo-sabor caleño.png">
    <title>Sabor Caleño - Reservar Mesa</title>
</head>
<body>

    <header>
        <nav class="d-flex justify-content-around align-items-center gap-4 p-3" style="background: linear-gradient(90deg, #ff6b00, #ff8c00, #ffb347);">
            <img src="../Assets/Img/logos/logo-sabor caleño.png" alt="Logo" style="width: 60px; border-radius: 10px; border: 2px solid black;">
            <p class="m-0 text-white fw-bold fs-3" style="font-style: italic;">Sabor Caleño</p>
            <div class="d-flex justify-content-end gap-4 align-items-center">
                <a class="text-white text-decoration-none fw-bold" href="../index.html">Inicio</a>
                <a class="text-white text-decoration-none fw-bold" href="contacto.html">Nosotros</a>
                <a class="text-white text-decoration-none fw-bold" href="menu.html">Menú</a>
            </div>
        </nav>
    </header>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-7">
                <div class="card shadow-sm border-0 p-4">
                    <h2 class="text-center fw-bold mb-4" style="color: #ff6b00;"><i class="fa-solid fa-calendar-days me-2"></i>Reserva tu Mesa</h2>
                    <p class="text-center text-muted mb-4">Asegura tu lugar para disfrutar en familia de la mejor sazón valluna.</p>

                    <form id="form-reserva">
                        <div class="mb-3">
                            <label for="reserva-nombre" class="form-label fw-semibold">¿A nombre de quién?</label>
                            <input type="text" class="form-control" id="reserva-nombre" required>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="reserva-fecha" class="form-label fw-semibold">Fecha</label>
                                <input type="date" class="form-control" id="reserva-fecha" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="reserva-hora" class="form-label fw-semibold">Hora</label>
                                <input type="time" class="form-control" id="reserva-hora" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="reserva-personas" class="form-label fw-semibold">Número de Personas</label>
                            <select class="form-select" id="reserva-personas" required>
                                <option value="1">1 Persona</option>
                                <option value="2" selected>2 Personas</option>
                                <option value="4">4 Personas</option>
                                <option value="6">6 o más Personas</option>
                            </select>
                        </div>

                        <div class="mb-4">
                            <label for="reserva-notas" class="form-label fw-semibold">Notas especiales (Opcional)</label>
                            <textarea class="form-control" id="reserva-notas" rows="2" placeholder="Ej: Silla para bebé, celebración de cumpleaños..."></textarea>
                        </div>

                        <button type="submit" class="btn w-100 text-white fw-bold py-2" style="background-color: #ff6b00;">
                            Confirmar Reserva
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bundle.min.js"></script>
    <script src="../Assets/JavaScript/reservas.js"></script>
</body>
</html>
