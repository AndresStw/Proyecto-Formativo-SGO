<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../Assets/CSS/index.css">
    <link rel="stylesheet" href="../Assets/CSS/login.css">
    <link rel="icon" href="../Assets/Img/logos/logo_sabor caleño2026.png">
    <title>Sabor Caleño - Registro</title>
</head>
<body class="bg-light d-flex align-items-center vh-100">

    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow border-0 p-4">
                    <div class="text-center mb-4">
                        <h3 class="fw-bold" style="color: #ff6b00;">Crear Cuenta</h3>
                        <p class="text-muted">Regístrate para realizar pedidos y reservar tus mesas.</p>
                    </div>

                    <form id="form-registro">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="nombre" class="form-label fw-semibold">Nombre Completo</label>
                                <input type="text" class="form-control" id="nombre" placeholder="Juan Pérez" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="telefono" class="form-label fw-semibold">Teléfono</label>
                                <input type="tel" class="form-control" id="telefono" placeholder="3001234567" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold">Correo Electrónico</label>
                            <input type="email" class="form-control" id="email" placeholder="correo@ejemplo.com" required>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label fw-semibold">Contraseña</label>
                            <input type="password" class="form-control" id="password" placeholder="Mínimo 6 caracteres" required>
                        </div>

                        <button type="submit" class="btn w-100 text-white my-2 fw-bold" style="background: linear-gradient(90deg, #ff6b00, #ff8c00, #ffb347); border: none;">
                            Registrarme
                        </button>
                    </form>

                    <div class="text-center mt-3">
                        <p class="mb-0 text-muted">¿Ya tienes cuenta? <a href="login.html" class="text-decoration-none fw-bold" style="color: #ff8c00;">Inicia sesión</a></p>
                        <a href="../index.html" class="d-block mt-3 text-muted text-decoration-none small"><i class="fa-solid fa-arrow-left me-1"></i> Volver al Inicio</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bundle.min.js"></script>
    <script src="../Assets/JavaScript/validaciones.js"></script>
</body>
</html>
